<memo-page-header [title]="isEdit() ? 'Карточка' : 'Новая карточка'">
  <button left type="button" class="memo-icon-btn" aria-label="Назад" (click)="cancel()">
    <memo-icon name="chevron-left" [size]="26" />
  </button>
  <button right type="button" class="memo-btn memo-btn--ghost memo-btn--small" [disabled]="!canSave()" (click)="save()">
    Готово
  </button>
</memo-page-header>

<form class="memo-page memo-page--no-tabs" (submit)="$event.preventDefault(); save()">
  @if (deck(); as deck) {
    <p class="deck-name">{{ deck.emoji }} {{ deck.title }}</p>
  }

  <div class="image-block">
    <button type="button" class="image-panel" [class.image-panel--empty]="!hasImage()" [disabled]="isImageLoading()" (click)="pickImage()">
      @if (isImageLoading()) {
        <span class="memo-spinner"></span>
      } @else if (pendingPreview()) {
        <img class="image-panel__preview" [src]="pendingPreview()" alt="" />
      } @else if (form().existingImageId) {
        <memo-card-image class="image-panel__preview" [imageId]="form().existingImageId" />
      } @else {
        <memo-icon name="image" [size]="36" class="image-panel__icon" />
        <span class="image-panel__title">Добавить изображение</span>
        <span class="image-panel__hint">Нажмите, чтобы выбрать файл или сделать фото</span>
      }
    </button>

    <div class="image-block__actions">
      <button type="button" class="memo-btn memo-btn--secondary memo-btn--small" [disabled]="isImageLoading()" (click)="pickImage()">
        <memo-icon name="image" [size]="18" />
        Файл…
      </button>
      @if (canReadClipboard) {
        <button type="button" class="memo-btn memo-btn--secondary memo-btn--small" [disabled]="isImageLoading()" (click)="pasteFromClipboard()">
          <memo-icon name="clipboard" [size]="18" />
          Буфер
        </button>
      }
      @if (hasImage()) {
        <button type="button" class="memo-btn memo-btn--danger memo-btn--small" (click)="removeImage()">
          <memo-icon name="trash" [size]="18" />
          Убрать
        </button>
      }
    </div>
    <input #fileInput class="image-block__input" type="file" accept="image/*" (change)="onFileSelected($event)" />
  </div>

  <label class="memo-field">
    <span class="memo-label">Вопрос (лицевая сторона)</span>
    <textarea
      #questionInput
      class="memo-textarea"
      placeholder="Слово, фраза или вопрос"
      rows="3"
      maxlength="1000"
      [value]="form().question"
      (input)="setQuestion($any($event.target).value)"
    ></textarea>
  </label>

  <label class="memo-field">
    <span class="memo-label">Ответ (обратная сторона)</span>
    <textarea
      class="memo-textarea"
      placeholder="Перевод, определение или ответ"
      rows="4"
      maxlength="2000"
      [value]="form().answer"
      (input)="setAnswer($any($event.target).value)"
    ></textarea>
  </label>

  @if (canSpeak) {
    <button type="button" class="memo-btn memo-btn--secondary speak-btn" [class.speak-btn--active]="isSpeaking()" [disabled]="!form().question.trim()" (click)="speakQuestion()">
      <memo-icon [name]="isSpeaking() ? 'volume-active' : 'volume'" [size]="18" />
      Озвучить вопрос
    </button>
  }

  <div class="actions">
    <button type="submit" class="memo-btn memo-btn--navy memo-btn--block" [disabled]="!canSave()">
      {{ isEdit() ? 'Сохранить' : 'Создать карточку' }}
    </button>
    @if (!isEdit()) {
      <button type="button" class="memo-btn memo-btn--secondary memo-btn--block" [disabled]="!canSave()" (click)="save(true)">
        Сохранить и ещё
      </button>
    } @else {
      <button type="button" class="memo-btn memo-btn--danger memo-btn--block" (click)="remove()">
        <memo-icon name="trash" [size]="18" />
        Удалить карточку
      </button>
    }
  </div>
</form>
