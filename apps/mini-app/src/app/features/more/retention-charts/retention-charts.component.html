<div class="chart memo-card">
  <div class="chart__title">Кривая забывания</div>
  <p class="chart__text memo-hint">Без повторений память о новом материале быстро слабеет.</p>
  <svg class="chart__svg" [attr.viewBox]="'0 0 ' + forgetting.width + ' ' + forgetting.height" role="img" aria-label="Кривая забывания">
    <defs>
      <linearGradient id="memo-forget-fill" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0%" stop-color="var(--memo-accent)" stop-opacity="0.35" />
        <stop offset="100%" stop-color="var(--memo-accent)" stop-opacity="0" />
      </linearGradient>
    </defs>
    @for (tick of forgetting.yTicks; track tick.label) {
      <line class="grid" x1="30" [attr.x2]="forgetting.width - 10" [attr.y1]="tick.position" [attr.y2]="tick.position" />
      <text class="label" x="26" [attr.y]="tick.position + 3" text-anchor="end">{{ tick.label }}</text>
    }
    @for (tick of forgetting.xTicks; track tick.label) {
      <text class="label" [attr.x]="tick.position" [attr.y]="forgetting.height - 8" text-anchor="middle">{{ tick.label }}</text>
    }
    @if (forgetting.area; as area) {
      <path class="area" [attr.d]="area" fill="url(#memo-forget-fill)" />
    }
    @for (line of forgetting.lines; track $index) {
      <path class="line line--accent" [attr.d]="line" />
    }
    <text class="label" [attr.x]="forgetting.width - 10" [attr.y]="forgetting.height - 8" text-anchor="end">дни</text>
  </svg>
</div>

<div class="chart memo-card">
  <div class="chart__title">Интервальное повторение</div>
  <p class="chart__text memo-hint">
    Каждое повторение возвращает память к 100 % и делает забывание медленнее — интервалы растут.
  </p>
  <svg class="chart__svg" [attr.viewBox]="'0 0 ' + spaced.width + ' ' + spaced.height" role="img" aria-label="Интервальное повторение">
    @for (tick of spaced.yTicks; track tick.label) {
      <line class="grid" x1="30" [attr.x2]="spaced.width - 10" [attr.y1]="tick.position" [attr.y2]="tick.position" />
      <text class="label" x="26" [attr.y]="tick.position + 3" text-anchor="end">{{ tick.label }}</text>
    }
    @for (mark of spaced.marks; track mark.label) {
      <line class="mark" [attr.x1]="mark.x" [attr.x2]="mark.x" y1="10" [attr.y2]="spaced.height - 24" />
      <text class="label" [attr.x]="mark.x" [attr.y]="spaced.height - 8" text-anchor="middle">{{ mark.label }}</text>
    }
    @for (line of spaced.lines; track $index) {
      <path class="line line--success" [attr.d]="line" />
    }
    @for (point of reviewPoints; track $index) {
      <circle class="dot" [attr.cx]="point.x" [attr.cy]="point.y" r="4" />
    }
  </svg>
</div>
