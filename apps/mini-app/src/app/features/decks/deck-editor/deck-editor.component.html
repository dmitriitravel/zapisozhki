<memo-page-header [title]="isEdit() ? 'Редактировать колоду' : 'Новая колода'">
  <button left type="button" class="memo-icon-btn" aria-label="Назад" (click)="cancel()">
    <memo-icon name="chevron-left" [size]="26" />
  </button>
  <button right type="button" class="memo-btn memo-btn--ghost memo-btn--small" [disabled]="!canSave()" (click)="save()">
    Готово
  </button>
</memo-page-header>

<form class="memo-page memo-page--no-tabs" (submit)="$event.preventDefault(); save()">
  <div class="preview">
    <label class="preview__emoji">
      <input
        class="preview__input"
        type="text"
        aria-label="Эмодзи колоды"
        [value]="form().emoji"
        (input)="setCustomEmoji($any($event.target).value)"
      />
    </label>
    <span class="memo-hint preview__hint">Нажмите, чтобы ввести свой эмодзи</span>
  </div>

  <div class="emojis">
    @for (emoji of emojis; track emoji) {
      <button
        type="button"
        class="emojis__item"
        [class.emojis__item--active]="emoji === form().emoji"
        (click)="setEmoji(emoji)"
      >
        {{ emoji }}
      </button>
    }
  </div>

  <label class="memo-field">
    <span class="memo-label">Название</span>
    <input
      class="memo-input"
      type="text"
      placeholder="Например, «Английский — фразы»"
      maxlength="80"
      autocomplete="off"
      [value]="form().title"
      (input)="setTitle($any($event.target).value)"
    />
  </label>

  <label class="memo-field">
    <span class="memo-label">Описание</span>
    <textarea
      class="memo-textarea"
      placeholder="О чём эта колода (необязательно)"
      maxlength="300"
      rows="3"
      [value]="form().description"
      (input)="setDescription($any($event.target).value)"
    ></textarea>
  </label>

  <div class="memo-section">
    <button type="button" class="memo-row" (click)="toggleActive()">
      <memo-icon name="zap" [size]="22" class="row-icon" />
      <div class="memo-row__body">
        <div class="memo-row__title">В Drilling list</div>
        <div class="memo-row__subtitle">Карточки колоды попадают в общее повторение</div>
      </div>
      <span class="memo-switch" [class.memo-switch--on]="form().isActive"></span>
    </button>
  </div>

  <button type="submit" class="memo-btn memo-btn--navy memo-btn--block" [disabled]="!canSave()">
    {{ isEdit() ? 'Сохранить' : 'Создать колоду' }}
  </button>
</form>
